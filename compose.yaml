name: setdraft
services:
  web:
    image: ${SETDRAFT_WEB_IMAGE:-setdraft/web:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${SETDRAFT_NODE_IMAGE:-node:24.18.0-bookworm-slim}
        DOCKER_CLI_IMAGE: ${SETDRAFT_DOCKER_CLI_IMAGE:-docker:29-cli}
        NPM_REGISTRY: ${SETDRAFT_NPM_REGISTRY:-https://registry.npmmirror.com}
        HTTP_PROXY: ${SETDRAFT_DOWNLOAD_PROXY:-}
        HTTPS_PROXY: ${SETDRAFT_DOWNLOAD_PROXY:-}
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "${SETDRAFT_BIND_ADDRESS:-0.0.0.0}:${SETDRAFT_PORT:-4321}:${SETDRAFT_PORT:-4321}"
    environment:
      PORT: ${SETDRAFT_PORT:-4321}
      SETDRAFT_WORKSPACE_ROOT: ${SETDRAFT_DATA_PATH:?Run ./install.sh first to generate .env.compose}
      SETDRAFT_PUBLIC_ORIGIN: ${SETDRAFT_PUBLIC_ORIGIN:-}
      SETDRAFT_SANDBOX_IMAGE: ${SETDRAFT_SANDBOX_IMAGE:-setdraft/sandbox:local}
      SETDRAFT_DOCKER_REGISTRY: ${SETDRAFT_DOCKER_REGISTRY:-}
      SETDRAFT_DEBIAN_MIRROR: ${SETDRAFT_DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
      SETDRAFT_TESTCASES_MAX: ${SETDRAFT_TESTCASES_MAX:-100}
      SETDRAFT_TOTAL_TIME_LIMIT_MS: ${SETDRAFT_TOTAL_TIME_LIMIT_MS:-60000}
      SETDRAFT_CASE_MAX_BYTES: ${SETDRAFT_CASE_MAX_BYTES:-67108864}
      SETDRAFT_PROJECT_MAX_BYTES: ${SETDRAFT_PROJECT_MAX_BYTES:-536870912}
    volumes:
      # Identical absolute paths let sibling sandbox containers bind each job's files.
      - type: bind
        source: ${SETDRAFT_DATA_PATH}
        target: ${SETDRAFT_DATA_PATH}
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
  sandbox:
    image: ${SETDRAFT_SANDBOX_IMAGE:-setdraft/sandbox:local}
    profiles: ["build"]
    build:
      context: packages/hydro-server/sandbox
      args:
        PYTHON_IMAGE: ${SETDRAFT_PYTHON_IMAGE:-python:3.14-slim-trixie}
        GCC_IMAGE: ${SETDRAFT_GCC_IMAGE:-gcc:16.2.0-trixie@sha256:28365a1efe31883fd29f9fce27811b731e815f9f9b2db16b0e1f0d99fcb3dae5}
        DEBIAN_MIRROR: ${SETDRAFT_DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
    entrypoint: ["/bin/true"]
    restart: "no"
