name: setdraft
services:
  web:
    image: ${SETDRAFT_WEB_IMAGE:-ghcr.io/albert-li-sz/setdraft:latest}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      search:
        condition: service_started
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "${SETDRAFT_BIND_ADDRESS:-0.0.0.0}:${SETDRAFT_PORT:-4321}:${SETDRAFT_PORT:-4321}"
    environment:
      SETDRAFT_DATABASE_URL: postgresql://setdraft_app:${SETDRAFT_DB_APP_PASSWORD:?Run ./install.sh}@database:5432/setdraft
      SETDRAFT_SEARCH_URL: http://search:8080
      PORT: ${SETDRAFT_PORT:-4321}
      SETDRAFT_WORKSPACE_ROOT: ${SETDRAFT_DATA_PATH:?Run ./install.sh first to generate .env.compose}
      SETDRAFT_PUBLIC_ORIGIN: ${SETDRAFT_PUBLIC_ORIGIN:-}
      SETDRAFT_OTEL_ENABLED: ${SETDRAFT_OTEL_ENABLED:-0}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-setdraft}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: ${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_HEADERS: ${OTEL_EXPORTER_OTLP_METRICS_HEADERS:-}
      OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: ${OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:-http/protobuf}
      SETDRAFT_SANDBOX_IMAGE: ${SETDRAFT_SANDBOX_IMAGE:-ghcr.io/albert-li-sz/setdraft-sandbox:latest}
      SETDRAFT_DOCKER_REGISTRY: ${SETDRAFT_DOCKER_REGISTRY:-}
      SETDRAFT_DEBIAN_MIRROR: ${SETDRAFT_DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
      SETDRAFT_TESTCASES_MAX: ${SETDRAFT_TESTCASES_MAX:-100}
      SETDRAFT_TOTAL_TIME_LIMIT_MS: ${SETDRAFT_TOTAL_TIME_LIMIT_MS:-60000}
      SETDRAFT_CASE_MAX_BYTES: ${SETDRAFT_CASE_MAX_BYTES:-67108864}
      SETDRAFT_PROJECT_MAX_BYTES: ${SETDRAFT_PROJECT_MAX_BYTES:-536870912}
      SETDRAFT_SANDBOX_CONCURRENCY: ${SETDRAFT_SANDBOX_CONCURRENCY:-2}
      SETDRAFT_SANDBOX_CONCURRENCY_PER_USER: ${SETDRAFT_SANDBOX_CONCURRENCY_PER_USER:-1}
      SETDRAFT_SANDBOX_CPUS: ${SETDRAFT_SANDBOX_CPUS:-1}
      SETDRAFT_SANDBOX_MEMORY_MB: ${SETDRAFT_SANDBOX_MEMORY_MB:-2048}
      SETDRAFT_AI_CONCURRENCY: ${SETDRAFT_AI_CONCURRENCY:-4}
      SETDRAFT_AI_MAX_OUTSTANDING: ${SETDRAFT_AI_MAX_OUTSTANDING:-64}
      SETDRAFT_AI_MAX_OUTSTANDING_PER_USER: ${SETDRAFT_AI_MAX_OUTSTANDING_PER_USER:-8}
      SETDRAFT_AI_QUEUE_TIMEOUT_MS: ${SETDRAFT_AI_QUEUE_TIMEOUT_MS:-1800000}
      SETDRAFT_AI_RUN_TIMEOUT_MS: ${SETDRAFT_AI_RUN_TIMEOUT_MS:-900000}
      SETDRAFT_SANDBOX_MAX_OUTSTANDING: ${SETDRAFT_SANDBOX_MAX_OUTSTANDING:-64}
      SETDRAFT_SANDBOX_MAX_OUTSTANDING_PER_USER: ${SETDRAFT_SANDBOX_MAX_OUTSTANDING_PER_USER:-8}
      SETDRAFT_SANDBOX_QUEUE_TIMEOUT_MS: ${SETDRAFT_SANDBOX_QUEUE_TIMEOUT_MS:-1800000}
      SETDRAFT_SANDBOX_RUN_TIMEOUT_MS: ${SETDRAFT_SANDBOX_RUN_TIMEOUT_MS:-900000}
      SETDRAFT_SANDBOX_BUILD_TIMEOUT_MS: ${SETDRAFT_SANDBOX_BUILD_TIMEOUT_MS:-1800000}
    volumes:
      # Identical absolute paths let sibling sandbox containers bind each job's files.
      - type: bind
        source: ${SETDRAFT_DATA_PATH}
        target: ${SETDRAFT_DATA_PATH}
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
  database:
    image: ${SETDRAFT_POSTGRES_IMAGE:-postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650}
    restart: unless-stopped
    environment:
      POSTGRES_DB: setdraft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SETDRAFT_DB_ADMIN_PASSWORD:?Run ./install.sh}
      SETDRAFT_DB_APP_PASSWORD: ${SETDRAFT_DB_APP_PASSWORD:?Run ./install.sh}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d setdraft"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    image: ${SETDRAFT_WEB_IMAGE:-ghcr.io/albert-li-sz/setdraft:latest}
    entrypoint: ["node", "packages/hydro-server/dist/migrate-cli.js"]
    environment:
      SETDRAFT_DB_APP_PASSWORD: ${SETDRAFT_DB_APP_PASSWORD:?Run ./install.sh}
      SETDRAFT_DATABASE_ADMIN_URL: postgresql://postgres:${SETDRAFT_DB_ADMIN_PASSWORD:?Run ./install.sh}@database:5432/setdraft
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  search:
    labels:
      org.setdraft.search-config: ${SETDRAFT_SEARCH_CONFIG_REVISION:-legacy}
    image: ${SETDRAFT_SEARCH_IMAGE:-searxng/searxng@sha256:5286edb35782454ab8a102c5eff6b54bff745853191b46aeead95f225aa6dfb6}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SETDRAFT_SEARCH_SECRET:?Run ./install.sh}
      HTTP_PROXY: ${SETDRAFT_SEARCH_PROXY:-}
      HTTPS_PROXY: ${SETDRAFT_SEARCH_PROXY:-}
      http_proxy: ${SETDRAFT_SEARCH_PROXY:-}
      https_proxy: ${SETDRAFT_SEARCH_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./deploy/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - search-cache:/var/cache/searxng
  maintenance:
    image: ${SETDRAFT_MAINTENANCE_IMAGE:-ghcr.io/albert-li-sz/setdraft-maintenance:latest}
    profiles: ["maintenance"]
    environment:
      SETDRAFT_DATABASE_ADMIN_URL: postgresql://postgres:${SETDRAFT_DB_ADMIN_PASSWORD:?Run ./install.sh}@database:5432/setdraft
      SETDRAFT_WORKSPACE_ROOT: ${SETDRAFT_DATA_PATH}
    volumes:
      - type: bind
        source: ${SETDRAFT_DATA_PATH}
        target: ${SETDRAFT_DATA_PATH}
    restart: "no"
  sandbox:
    image: ${SETDRAFT_SANDBOX_IMAGE:-ghcr.io/albert-li-sz/setdraft-sandbox:latest}
    profiles: ["build"]
    entrypoint: ["/bin/true"]
    restart: "no"

volumes:
  postgres-data:
  search-cache:
