<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f7f7f7" />
		<script>
			try {
				const preference = localStorage.getItem("setdraft.theme");
				const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.theme = dark ? "dark" : "light";
				document.documentElement.style.colorScheme = dark ? "dark" : "light";
				document.querySelector('meta[name="theme-color"]').content = dark ? "#141414" : "#f7f7f7";
			} catch {
				const dark = matchMedia("(prefers-color-scheme: dark)").matches;
				document.documentElement.dataset.theme = dark ? "dark" : "light";
				document.documentElement.style.colorScheme = dark ? "dark" : "light";
			}
		</script>
		<meta name="description" content="Setdraft · 题序 — Competitive Programming Workspace" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Setdraft · 题序</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
