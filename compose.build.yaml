# Optional source builds: use ./install.sh --build.
services:
  web:
    build:
      context: .
      target: web
      args:
        NODE_IMAGE: ${SETDRAFT_NODE_IMAGE:-node:24.18.0-bookworm-slim}
        DOCKER_CLI_IMAGE: ${SETDRAFT_DOCKER_CLI_IMAGE:-docker:29-cli}
        NPM_REGISTRY: ${SETDRAFT_NPM_REGISTRY:-https://registry.npmmirror.com}
        HTTP_PROXY: ${SETDRAFT_DOWNLOAD_PROXY:-}
        HTTPS_PROXY: ${SETDRAFT_DOWNLOAD_PROXY:-}
  maintenance:
    build:
      context: .
      target: maintenance
      args:
        NODE_IMAGE: ${SETDRAFT_NODE_IMAGE:-node:24.18.0-bookworm-slim}
        DOCKER_CLI_IMAGE: ${SETDRAFT_DOCKER_CLI_IMAGE:-docker:29-cli}
        POSTGRES_IMAGE: ${SETDRAFT_POSTGRES_IMAGE:-postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650}
        NPM_REGISTRY: ${SETDRAFT_NPM_REGISTRY:-https://registry.npmmirror.com}
        HTTP_PROXY: ${SETDRAFT_DOWNLOAD_PROXY:-}
        HTTPS_PROXY: ${SETDRAFT_DOWNLOAD_PROXY:-}
  sandbox:
    build:
      context: packages/hydro-server/sandbox
      args:
        PYTHON_IMAGE: ${SETDRAFT_PYTHON_IMAGE:-python:3.14-slim-trixie}
        GCC_IMAGE: ${SETDRAFT_GCC_IMAGE:-gcc:16.2.0-trixie@sha256:28365a1efe31883fd29f9fce27811b731e815f9f9b2db16b0e1f0d99fcb3dae5}
        DEBIAN_MIRROR: ${SETDRAFT_DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
