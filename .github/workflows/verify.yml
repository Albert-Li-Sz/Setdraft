name: Verify source

on:
  workflow_call:
    inputs:
      full-e2e:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_PASSWORD: smoke-admin-password
          POSTGRES_DB: setdraft_smoke
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d setdraft_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Build and check must not rewrite tracked inputs
        run: git diff --exit-code

      - name: Test
        run: npm test

      - name: Install pinned Chromium
        if: matrix.node == 24 && !inputs.full-e2e
        run: npx playwright install --with-deps chromium

      - name: Core browser tests against production build
        if: matrix.node == 24 && !inputs.full-e2e
        env:
          SETDRAFT_E2E_DATABASE_URL: postgresql://postgres:smoke-admin-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/setdraft_smoke
        run: npm run test:e2e

      - name: Preserve browser failure evidence
        if: failure() && matrix.node == 24 && !inputs.full-e2e
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-core-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Production page smoke test
        env:
          SETDRAFT_DATABASE_ADMIN_URL: postgresql://postgres:smoke-admin-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/setdraft_smoke
          SETDRAFT_DB_APP_PASSWORD: smoke-app-password-0123456789
          SETDRAFT_DATABASE_URL: postgresql://setdraft_app:smoke-app-password-0123456789@127.0.0.1:${{ job.services.postgres.ports[5432] }}/setdraft_smoke
        run: |
          node packages/hydro-server/dist/migrate-cli.js
          SETDRAFT_WEB_ROOT="$PWD/packages/hydro-web/dist" SETDRAFT_WORKSPACE_ROOT="$RUNNER_TEMP/hydro-smoke" node packages/hydro-server/dist/cli.js > "$RUNNER_TEMP/hydro-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/hydro-smoke.log"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/ > "$RUNNER_TEMP/index.html"; then break; fi
            sleep 1
          done
          grep -q '<div id="root"' "$RUNNER_TEMP/index.html"
          curl --fail --silent http://127.0.0.1:4321/api/health | grep -q '"status":"ok"'

  sandbox-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build runtime dependencies
        run: npm run build:hydro
      - name: Build sandbox image
        run: docker build -t setdraft/sandbox:local packages/hydro-server/sandbox
      - name: Prepare the pinned QDUOJ importer contract
        run: |
          node scripts/fetch-qduoj-contract.mjs
          python3.12 -m venv .artifacts/qduoj-python
          .artifacts/qduoj-python/bin/pip install -r scripts/qduoj-contract-requirements.txt
          echo "SETDRAFT_QDUOJ_CONTRACT_ROOT=$GITHUB_WORKSPACE/.artifacts/qduoj-contract" >> "$GITHUB_ENV"
          echo "SETDRAFT_QDUOJ_CONTRACT_PYTHON=$GITHUB_WORKSPACE/.artifacts/qduoj-python/bin/python" >> "$GITHUB_ENV"
      - name: Sandbox integration tests
        env:
          SETDRAFT_REQUIRE_SANDBOX: '1'
          SETDRAFT_REQUIRE_IMPORTER: '1'
        run: npm run test --workspace=@setdraft/server

      - name: Install pinned Chromium for full browser tests
        if: inputs.full-e2e
        run: npx playwright install --with-deps chromium
      - name: Full browser tests with real sandbox and PDFs
        if: inputs.full-e2e
        run: npm run test:e2e:full
      - name: Preserve full browser failure evidence
        if: failure() && inputs.full-e2e
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-full-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 14
