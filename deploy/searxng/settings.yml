use_default_settings:
  engines:
    keep_only: [bing, 360search, arxiv]
engines:
  - name: bing
    disabled: false
    # Verified from the native/Compose network on 2026-10-01.
    base_url: https://cn.bing.com
  - name: 360search
    disabled: false
    timeout: 8.0
  - name: arxiv
    disabled: false
    # Include papers in the general queries sent by Setdraft and its deployment preflight.
    categories: [general, science, scientific publications]
    timeout: 8.0
search:
  formats: [json]
  safe_search: 1
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0
