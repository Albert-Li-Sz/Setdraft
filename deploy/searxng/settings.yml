use_default_settings:
  engines:
    keep_only: [bing, duckduckgo, brave, baidu]
engines:
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: baidu
    disabled: false
search:
  formats: [json]
  safe_search: 1
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0
